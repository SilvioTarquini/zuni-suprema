<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Leitura no site encerrada — ZUNI Suprema</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- Pinterest: tag de rastreamento -->
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0f0f0f;
    font-family: Georgia, 'Times New Roman', serif;
    color: #f2ead9;
    text-align: center;
    padding: 24px;
  }
  .caixa { max-width: 480px; }
  h1 { color: #B8963E; font-size: 1.6rem; margin-bottom: 12px; letter-spacing: 0.5px; }
  p { line-height: 1.6; color: #d8cfba; }
  a.whatsapp { color: #d9c68f; text-decoration: underline; text-underline-offset: 3px; }
  a.botao {
    display: inline-block;
    margin: 20px 6px 0;
    padding: 12px 28px;
    background: #B8963E;
    color: #0f0f0f;
    text-decoration: none;
    border-radius: 4px;
    font-weight: bold;
    letter-spacing: 0.5px;
  }
  a.botao.secundario { background: none; color: #d9c68f; border: 1px solid #6b5533; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
  <div class="caixa">
    <h1>O prazo de acesso a este livro expirou</h1>
    <p>O período de leitura deste livro no site terminou. O seu PDF continua disponível para baixar e guardar. Se precisar de ajuda, fale com a gente pelo <a class="whatsapp" href="https://wa.me/5515996088895" target="_blank" rel="noopener">WhatsApp</a>.</p>
    <a class="botao" id="baixar-pdf" href="#" hidden>Baixar PDF</a>
    <a class="botao secundario" href="/loja">Voltar à loja</a>
  </div>
  <script>
    // O link do PDF usa o mesmo token da URL desta página (/livros/<id>?token=…); sem token, o botão nem aparece.
    (function () {
      var t = new URLSearchParams(location.search).get('token');
      var m = location.pathname.match(/^\/livros\/([A-Za-z0-9_-]+)\/?$/);
      if (!t || !m) return;
      var a = document.getElementById('baixar-pdf');
      a.href = '/livros/' + m[1] + '/pdf?token=' + encodeURIComponent(t);
      a.hidden = false;
    })();
  </script>
</body>
</html>
